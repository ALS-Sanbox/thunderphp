name: CI

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: thunderphp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, pdo_mysql, mbstring, json, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent && break
            sleep 2
          done

      - name: Write test config.php
        run: |
          cat > config.php <<'EOF'
          <?php
          define('APP_NAME', 'ThunderPHP');
          define('APP_DESCRIPTION', 'CI test run');
          define('DB_NAME', 'thunderphp_test');
          define('DB_USER', 'root');
          define('DB_PASSWORD', 'root');
          define('DB_HOST', '127.0.0.1');
          define('DB_DRIVER', 'mysql');
          define('ROOT', 'http://127.0.0.1:8000');
          EOF

      - name: Run migrations against the test database
        run: php thunder do:migrate all

      - name: Run PHPUnit
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_NAME: thunderphp_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: root
        run: vendor/bin/phpunit
